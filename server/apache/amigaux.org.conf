# amigaux.org (+ www) -- the public site.  Static files only, deployed with
# deploy.sh from this repository.  Unlike pkg.amigaux.org this host has
# no plain-HTTP client, so http redirects to https once the cert exists.

<Directory /var/www/amigaux.org>
    # No listing, no symlinks (the tree needs none; the deploy account can
    # write one).  The RewriteRules below are VirtualHost-scoped, so they do
    # not need FollowSymLinks.
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# The stats dashboard. Password-protected, noindex, and reachable only over
# HTTPS -- the *:80 vhost redirects everything except the ACME path, so the
# credentials are never sent in clear.
<Directory /var/www/amigaux.org/stats>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    AuthType Basic
    AuthName "amigaux.org stats"
    AuthUserFile /etc/apache2/stats.htpasswd
    Require valid-user
</Directory>

<VirtualHost *:80>
    ServerName amigaux.org
    ServerAlias www.amigaux.org
    DocumentRoot /var/www/amigaux.org
    # ACME http-01 challenges are answered here over plain http; everything
    # else goes to https -- but only once the certificate exists, so a fresh
    # host never redirects visitors into a certificate mismatch.
    <IfFile /etc/letsencrypt/live/amigaux.org/fullchain.pem>
        RewriteEngine on
        RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
        RewriteRule ^ https://amigaux.org%{REQUEST_URI} [L,R=301]
    </IfFile>
    ErrorLog ${APACHE_LOG_DIR}/amigaux.org-error.log
    CustomLog ${APACHE_LOG_DIR}/amigaux.org-access.log combined
</VirtualHost>

<IfFile /etc/letsencrypt/live/amigaux.org/fullchain.pem>
<VirtualHost *:443>
    ServerName amigaux.org
    ServerAlias www.amigaux.org
    DocumentRoot /var/www/amigaux.org
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/amigaux.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/amigaux.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    # Canonical host is the apex.
    RewriteEngine on
    RewriteCond %{HTTP_HOST} ^www\.amigaux\.org$ [NC]
    RewriteRule ^ https://amigaux.org%{REQUEST_URI} [L,R=301]
    ErrorLog ${APACHE_LOG_DIR}/amigaux.org-error.log
    CustomLog ${APACHE_LOG_DIR}/amigaux.org-access.log combined
</VirtualHost>
</IfFile>
