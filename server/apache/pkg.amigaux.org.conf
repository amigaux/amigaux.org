# pkg.amigaux.org -- the Amix package repository (canonical).
#
# apkg, the client on the Amix side, is a C89 HTTP/1.0 client with no TLS:
# the *:80 vhost MUST serve the tree directly and MUST NEVER redirect to
# https.  The *:443 twin below exists for browsers only.
#
# catalog.md5 and the per-package md5s cover the raw bytes on disk, so
# nothing here may transform a response: no index pages, no content
# encoding, no deflate.
#
# Tree (written by the release tooling in the amix repository, never by hand):
#   /catalog  /catalog.md5  /pkgs/<category>/<name>.pkg[.Z]
# Plus /robots.txt (from server/robots.txt in this repository).

<Directory /var/www/pkg.amigaux.org>
    # Unlisted: files are served, directories are never listed.  Symlinks are
    # never followed: the tree needs none, and the deploy account can write
    # (and rsync -a would faithfully copy) a stray link.
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted

    # Never compress: checksums cover raw bytes.  (no-brotli covers mod_brotli
    # should it ever be enabled; it is not installed today.)
    SetEnv no-gzip 1
    SetEnv no-brotli 1

    # The extension-less catalog files would otherwise carry no Content-Type.
    <Files "catalog">
        ForceType text/plain
    </Files>
    <Files "catalog.md5">
        ForceType text/plain
    </Files>
    AddType application/octet-stream .pkg
    # .pkg.Z keeps Apache's default type (application/x-compress); make sure
    # no Content-Encoding is ever attached even if mime.conf changes.
    RemoveEncoding .Z
</Directory>

<VirtualHost *:80>
    ServerName pkg.amigaux.org
    DocumentRoot /var/www/pkg.amigaux.org
    # No redirect here -- ever.  See the header comment.
    ErrorLog ${APACHE_LOG_DIR}/pkg.amigaux.org-error.log
    CustomLog ${APACHE_LOG_DIR}/pkg.amigaux.org-access.log combined
</VirtualHost>

# Active only once the certificate exists (issued once by hand with certbot
# --webroot), so this file passes configtest before and after certbot has run.
<IfFile /etc/letsencrypt/live/amigaux.org/fullchain.pem>
<VirtualHost *:443>
    ServerName pkg.amigaux.org
    DocumentRoot /var/www/pkg.amigaux.org
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/amigaux.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/amigaux.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    ErrorLog ${APACHE_LOG_DIR}/pkg.amigaux.org-error.log
    CustomLog ${APACHE_LOG_DIR}/pkg.amigaux.org-access.log combined
</VirtualHost>
</IfFile>
